services:
  db:
    image: postgres:16-alpine
    container_name: stayscore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayscore
      POSTGRES_PASSWORD: stayscore
      POSTGRES_DB: stayscore
    ports:
      - '5432:5432'
    volumes:
      - stayscore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayscore -d stayscore']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stayscore_pgdata:
