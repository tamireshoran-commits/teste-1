name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stayscore
          POSTGRES_PASSWORD: stayscore
          POSTGRES_DB: stayscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayscore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credenciais efêmeras do serviço de CI — não são segredos.
      DATABASE_URL: postgresql://stayscore:stayscore@localhost:5432/stayscore?schema=public
      AUTH_SECRET: ci-only-secret-nao-usado-em-producao
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Rodar testes
        run: npm test

      - name: Build de produção
        run: npx next build
